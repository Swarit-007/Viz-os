<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VizOS</title>
    <meta name="description" content="Interactive visualizer for operating-system algorithms: CPU and disk scheduling, paging, memory allocation and deadlocks.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b8f03c'/%3E%3Cpath d='M8 9l8 15 8-15' fill='none' stroke='%2310190a' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <a class="skip" href="#view">Skip to content</a>
    <aside class="sidebar">
        <a class="brand" href="#/" aria-label="VizOS home"><span class="brand-mark" aria-hidden="true"></span><span>VizOS</span></a>
        <nav id="nav" aria-label="Algorithms"></nav>
        <div class="sidebar-foot">
            <button id="theme-toggle" class="btn btn-ghost btn-sm" type="button">Switch theme</button>
            <div class="keys"><kbd>R</kbd><span>randomise</span><kbd>Space</kbd><span>play or pause</span><kbd>[ ]</kbd><span>step back or forward</span></div>
        </div>
    </aside>
    <div class="main">
        <header class="topbar">
            <button id="nav-toggle" class="icon-btn menu-btn" type="button" aria-label="Menu">Menu</button>
            <div class="topbar-title">
                <h1 id="view-title">VizOS</h1>
                <p id="view-blurb"></p>
            </div>
            <div class="topbar-actions">
                <button id="export-btn" class="btn btn-secondary btn-sm" type="button" hidden>Export JSON</button>
                <button id="random-btn" class="btn btn-primary" type="button" hidden>Randomise</button>
            </div>
        </header>
        <main id="view" tabindex="-1"></main>
    </div>
    <noscript><p style="padding:2rem">VizOS needs JavaScript to run.</p></noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
