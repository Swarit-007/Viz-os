[project]
name = "vizos"
version = "2.0.0"
description = "Interactive Operating System algorithm visualizer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Flask>=3.0,<4", "Flask-Cors>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
prod = ["gunicorn>=22"]

[tool.ruff]
line-length = 110
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP035"]  # keep typing.List etc. for Python 3.9 compatibility
